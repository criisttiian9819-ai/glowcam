name: Crear instaladores GlowCam

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probar la extensión en Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install playwright
          python -m playwright install --with-deps chromium
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1080x1920:rate=30 -f lavfi -i sine=frequency=440 -t 6 -c:v libvpx-vp9 -b:v 1M -deadline realtime -c:a libopus test.webm
          python tests/test_extension.py test.webm

      - name: Empaquetar extensión
        run: |
          mkdir -p out/GlowCam-Extension
          cp -R extension/* out/GlowCam-Extension/
          cd out && zip -r ../GlowCam-Extension.zip GlowCam-Extension

      - uses: actions/upload-artifact@v4
        with:
          name: GlowCam-Extension.zip
          path: GlowCam-Extension.zip

      - name: Publicar descarga
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GlowCam-Extension.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: GlowCam-Windows.exe
          - os: macos-latest
            file: GlowCam-Mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_core.py -k "not window_builds"

      - name: Compilar
        run: pyinstaller glowcam.spec --noconfirm

      # ---------- Windows: instalador todo en uno ----------
      - name: Descargar cámara virtual
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./installer/get_vcam.ps1

      - name: Crear instalador
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -notmatch '^\d') { $ver = "1.2.0" }
          & $iscc "/DAppVersion=$ver" installer\glowcam.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }
          Copy-Item dist\GlowCam-Windows.exe GlowCam-Windows.exe

      - name: Probar instalador y cámara virtual (sin OBS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\GlowCam-Windows.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador devolvió $($p.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\GlowCam\GlowCam.exe")) { throw "No se instaló GlowCam.exe" }
          python installer\smoke_vcam.py

      # ---------- Mac ----------
      - name: Empaquetar Mac
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R dist/GlowCam.app dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname GlowCam -srcfolder dmg -ov -format UDZO GlowCam-Mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

      - name: Publicar descarga
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
