<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  html, body { margin: 0; background: #141418; color: #f2f2f5; font-size: 13px; overflow: hidden; }
  .list { border: 1px solid #2c2c36; border-radius: 9px; max-height: 236px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #22222a; cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #1d1d24; }
  .row.sel { background: #2a1d29; }
  .thumb { width: 30px; height: 44px; border-radius: 5px; object-fit: cover; background: #000; flex: none; }
  .meta { flex: 1; min-width: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.sel .name { color: #ff8cc0; font-weight: 700; }
  .sub { color: #8a8a96; font-size: 11px; margin-top: 2px; }
  .del { background: none; border: none; color: #777; cursor: pointer; font-size: 13px; padding: 4px; }
  .del:hover { color: #ff5f7a; }
  .empty { padding: 14px 10px; color: #8a8a96; text-align: center; font-size: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .add { background: #ff5fa2; color: #141418; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .count { color: #8a8a96; font-size: 11px; }
  input[type=file] { display: none; }
  .busy { color: #ffcf7a; font-size: 11px; }
</style>
</head>
<body>
  <div class="list" id="list"></div>
  <div class="bar">
    <button class="add" id="add">＋ Añadir vídeos</button>
    <span class="count" id="count"></span>
  </div>
  <input type="file" id="file" accept="video/*" multiple>
  <script src="library.js"></script>
</body>
</html>
